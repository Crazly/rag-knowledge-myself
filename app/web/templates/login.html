<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 知识库</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div style="max-width:360px;margin:80px auto;text-align:center;">
    <h2>知识库</h2>
    <form action="/api/login" method="post" style="margin-top:24px;">
        <input type="password" name="token" placeholder="请输入访问令牌" required
               style="width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:14px;">
        <button type="submit" style="width:100%;margin-top:12px;">登录</button>
    </form>
    {% if error %}
    <p style="color:#d32f2f;margin-top:16px;">{{ error }}</p>
    {% endif %}
</div>
</body>
</html>
