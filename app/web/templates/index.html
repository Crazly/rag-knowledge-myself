{% extends "base.html" %}
{% block content %}
<div class="chat-container">
    <h2>知识问答</h2>
    <div id="chat-history" class="chat-history"></div>
    <form id="chat-form">
        <textarea id="question-input" name="question" rows="3"
                  placeholder="输入你的问题...（Enter 发送，Shift+Enter 换行）" required></textarea>
        <button type="submit" id="send-btn">提问</button>
        <span class="hint" id="status-text"></span>
    </form>
</div>

<script>
const form = document.getElementById('chat-form');
const input = document.getElementById('question-input');
const history = document.getElementById('chat-history');
const sendBtn = document.getElementById('send-btn');
const statusText = document.getElementById('status-text');

// Enter to submit, Shift+Enter for newline
input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        form.dispatchEvent(new Event('submit'));
    }
});

form.addEventListener('submit', async function(e) {
    e.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    // Disable input while processing
    input.disabled = true;
    sendBtn.disabled = true;
    sendBtn.textContent = '生成中...';
    statusText.textContent = '';

    // Create a new QA block for streaming
    const qaBlock = document.createElement('div');
    qaBlock.className = 'qa-item';
    qaBlock.innerHTML = `<div class='question'>Q: ${escapeHtml(question)}</div>
                         <div class='answer' id="stream-answer"></div>`;
    history.appendChild(qaBlock);
    const answerDiv = qaBlock.querySelector('.answer');

    input.value = '';
    history.scrollTop = history.scrollHeight;

    try {
        const formData = new FormData();
        formData.append('question', question);

        const resp = await fetch('/api/chat/stream', {
            method: 'POST',
            body: formData,
        });

        if (!resp.ok) {
            answerDiv.innerHTML = `<span class="error">请求失败 (${resp.status})</span>`;
            return;
        }

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
            const {done, value} = await reader.read();
            if (done) break;

            buffer += decoder.decode(value, {stream: true});
            const lines = buffer.split('\n');
            buffer = lines.pop() || '';

            for (const line of lines) {
                if (line.startsWith('event: ') || line.startsWith('data: ')) {
                    const isEvent = line.startsWith('event: ');
                    const content = line.slice(isEvent ? 7 : 6);

                    if (isEvent) {
                        window._sseEvent = content;
                    } else if (window._sseEvent) {
                        const event = window._sseEvent;
                        window._sseEvent = null;

                        if (event === 'token') {
                            const text = JSON.parse(content);
                            answerDiv.textContent += text;
                            history.scrollTop = history.scrollHeight;
                        } else if (event === 'status') {
                            statusText.textContent = content;
                        } else if (event === 'sources') {
                            const sourceDiv = document.createElement('div');
                            sourceDiv.className = 'sources';
                            sourceDiv.innerHTML = JSON.parse(content);
                            qaBlock.appendChild(sourceDiv);
                        } else if (event === 'error') {
                            answerDiv.innerHTML = `<span class="error">${escapeHtml(content)}</span>`;
                            statusText.textContent = '出错';
                        } else if (event === 'answer') {
                            answerDiv.textContent = content;
                        }
                    }
                }
            }
        }
    } catch (err) {
        answerDiv.innerHTML = `<span class="error">网络错误：${escapeHtml(err.message)}</span>`;
    } finally {
        input.disabled = false;
        sendBtn.disabled = false;
        sendBtn.textContent = '提问';
        statusText.textContent = '';
        input.focus();
    }
});

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
{% endblock %}
